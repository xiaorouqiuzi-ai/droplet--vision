[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "droplet-vision"
version = "0.1.0"
description = "Scientific interfaces for high-speed suspended-droplet vision"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
cine = ["pims==0.7"]
ui = ["PySide6==6.10.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"droplet_vision.ui" = ["translations/*.json"]
